services:
  - type: worker
    name: line-buddy-odds-worker
    runtime: python
    rootDir: python-odds-service
    buildCommand: pip install -r requirements.txt
    startCommand: python src/main.py
    # Deliberately off. Once this is on, a push to the connected branch
    # deploys AND the worker starts running forever, immediately spending
    # real budget against every enabled provider (SharpAPI, Odds-API.io,
    # SportsGameOdds, Propline) on a live schedule. Flip this on (or trigger
    # one deploy manually from the dashboard) only when that's a deliberate
    # choice, not a side effect of pushing something unrelated.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Secrets — intentionally NOT given values here. `sync: false` makes
      # Render prompt for each in its dashboard on first setup; nothing
      # sensitive ever goes into this file or the repo.
      - key: DATABASE_URL
        sync: false
      - key: SHARPAPI_KEY
        sync: false
      - key: ODDSAPIIO_KEY
        sync: false
      - key: SPORTSGAMEODDS_KEY
        sync: false
      - key: PARLAYAPI_KEY
        sync: false
      - key: PARLAYAPI_MLB_KEY
        sync: false
      - key: PROPLINE_KEY
        sync: false
      - key: PROPLINE_2_KEY
        sync: false
      # CFB's X-signal (Phase 3, 2026-08-27) — same CFBD account the TS
      # side (lib/sports/cfb/cfbd.ts) already uses, user-confirmed reuse
      # rather than a second key. Set the same value here in Render's
      # dashboard.
      - key: CFBD_API_KEY
        sync: false

  # Real gap this closes: the worker above going fully silent for 4 real
  # days (2026-08-22 -> 2026-08-26, a hang inside a job that never crashed,
  # never restarted, and never got noticed) went undetected because nothing
  # independent of that same process was ever watching it. health_check.py
  # already does the right checks (per-job staleness, real ground-truth data
  # checks, game_odds_book_lines freshness) — it just never ran on its own
  # schedule. A cron job is a genuinely separate process/container from the
  # worker, so a worker that's fully frozen (not crashed, not restarted,
  # event loop wedged) can't also freeze this — the one failure mode this
  # is specifically for.
  #
  # Read-only against already-written data (snapshot_cache breadcrumbs,
  # real Postgres tables) — makes zero provider API calls, spends zero
  # budget, so this is safe to auto-deploy unlike the worker above. Exit
  # code is 1 on any unhealthy check (see health_check.py's own docstring);
  # Render's own cron-job failure notification is what actually pages
  # someone — wire that up in the dashboard (Settings -> Notifications) once
  # this is deployed, since a green "job ran" in Render's UI without that
  # doesn't alert anyone on its own.
  - type: cron
    name: line-buddy-odds-worker-health-check
    runtime: python
    rootDir: python-odds-service
    buildCommand: pip install -r requirements.txt
    schedule: "*/15 * * * *"
    startCommand: python src/health_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      # Transaction-mode pooler (port 6543), not session-mode (5432) like
      # the worker — see config.py's DB_POOLER_MODE docstring. Session
      # mode's connection cap kept refusing this cron's own brand-new
      # connection even after trimming every other consumer's pool size
      # (2026-08-26); transaction mode multiplexes over far fewer physical
      # backends and doesn't hold one dedicated to this short-lived process.
      - key: DB_POOLER_MODE
        value: transaction
