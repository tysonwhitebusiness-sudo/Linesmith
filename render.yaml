services:
  - type: worker
    name: line-buddy-odds-worker
    runtime: python
    rootDir: python-odds-service
    buildCommand: pip install -r requirements.txt
    startCommand: python src/main.py
    # Deliberately off. Once this is on, a push to the connected branch
    # deploys AND the worker starts running forever, immediately spending
    # real budget against every enabled provider (SharpAPI, Odds-API.io,
    # SportsGameOdds, Propline) on a live schedule. Flip this on (or trigger
    # one deploy manually from the dashboard) only when that's a deliberate
    # choice, not a side effect of pushing something unrelated.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Secrets — intentionally NOT given values here. `sync: false` makes
      # Render prompt for each in its dashboard on first setup; nothing
      # sensitive ever goes into this file or the repo.
      - key: DATABASE_URL
        sync: false
      - key: SHARPAPI_KEY
        sync: false
      - key: ODDSAPIIO_KEY
        sync: false
      - key: SPORTSGAMEODDS_KEY
        sync: false
      - key: PARLAYAPI_KEY
        sync: false
      - key: PARLAYAPI_MLB_KEY
        sync: false
      - key: PROPLINE_KEY
        sync: false
      - key: PROPLINE_2_KEY
        sync: false
      # CFB's X-signal (Phase 3, 2026-08-27) — same CFBD account the TS
      # side (lib/sports/cfb/cfbd.ts) already uses, user-confirmed reuse
      # rather than a second key. Set the same value here in Render's
      # dashboard.
      - key: CFBD_API_KEY
        sync: false
      # Phase 1.6 (standing decision Q9) — its absence was an oversight, not a
      # choice. Without it mlbGameLinesJob logged "ODDS_API_KEY is not set —
      # game lines are turned off" on every tick, while the TS route
      # app/api/odds/game-lines held the only working copy of the key. Set in
      # the dashboard; declared here so the next person sees the worker needs
      # it.
      - key: ODDS_API_KEY
        sync: false
      # ---------------------------------------------------------------------
      # Added 2026-09-02. THESE FIVE KEYS WERE REQUIRED BY config.py AND
      # DECLARED NOWHERE, and four of them exist in the operator's .env.local.
      # config.py falls back to a local dotenv, so every one of these providers
      # worked on the operator's machine and was silently OFF on this worker:
      # a provider is live only if `env_bool(FLAG, default=True) and bool(KEY)`,
      # env_bool defaults to True, so it is the MISSING KEY that disables --
      # with no error, and with the job still reporting healthy.
      #
      # Cost of the omission, measured: NFL, CFB and NBA had no live odds at
      # all. ParlayAPI cannot produce game lines (its endpoint is /props), so
      # sportsgameodds_multisport is their ONLY game-line producer and its
      # absence removed game lines with no second path. All four last recorded
      # spend on 2026-08-21 and nothing since. See
      # docs/odds-sources-2026-09-02.md §4.
      - key: SPORTSGAMEODDS_MULTISPORT_KEY
        sync: false
      - key: PARLAYAPI_NFL_KEY
        sync: false
      - key: PARLAYAPI_CFB_KEY
        sync: false
      - key: PARLAYAPI_SOCCER_KEY
        sync: false
      # Never provisioned anywhere, including locally. NBA props stay off until
      # a real key exists — see _PARLAYAPI_SPORT_CONFIG's own comment.
      - key: PARLAYAPI_NBA_KEY
        sync: false
      # ---------------------------------------------------------------------
      # Soft caps: values, NOT secrets, so they are set here rather than in the
      # dashboard and take effect on deploy with no operator action.
      #
      # Task 5.9 added these to stop a run-away short of the hard limit, and
      # CLAUDE.md records them as "set to 800 against a hard limit of 1000, so
      # wiring them genuinely lowered that gate by 20%." Measured 2026-09-02:
      # true in .env.local, FALSE here — they were undeclared, config.py's
      # default is 0 (= unset), and ProviderSpec.effective_cap is
      # min(soft_cap, cap_limit) with 0 meaning unset, so the worker's real gate
      # was the hard 1,000. The 20% margin did not exist where it runs.
      #
      # This matters more for ParlayAPI than for a daily-capped provider: its
      # cap is MONTHLY, so blowing it costs the rest of the month.
      - key: PARLAYAPI_SOFT_CAP
        value: "800"
      - key: PARLAYAPI_MLB_SOFT_CAP
        value: "800"
      - key: PARLAYAPI_NFL_SOFT_CAP
        value: "800"
      - key: PARLAYAPI_CFB_SOFT_CAP
        value: "800"
      - key: PARLAYAPI_SOCCER_SOFT_CAP
        value: "800"
      - key: PARLAYAPI_NBA_SOFT_CAP
        value: "800"
      # SportsGameOdds gates on a soft cap rather than a vendor hard limit (see
      # CLAUDE.md's provider-job section). Its code default is already 2000, so
      # this changes nothing today — declared so the number is visible here
      # rather than only in config.py, and so raising it is an edit to this file
      # rather than a surprise.
      - key: SPORTSGAMEODDS_SOFT_CAP
        value: "2000"

  # Real gap this closes: the worker above going fully silent for 4 real
  # days (2026-08-22 -> 2026-08-26, a hang inside a job that never crashed,
  # never restarted, and never got noticed) went undetected because nothing
  # independent of that same process was ever watching it. health_check.py
  # already does the right checks (per-job staleness, real ground-truth data
  # checks, game_odds_book_lines freshness) — it just never ran on its own
  # schedule. A cron job is a genuinely separate process/container from the
  # worker, so a worker that's fully frozen (not crashed, not restarted,
  # event loop wedged) can't also freeze this — the one failure mode this
  # is specifically for.
  #
  # Read-only against already-written data (snapshot_cache breadcrumbs,
  # real Postgres tables) — makes zero provider API calls, spends zero
  # budget, so this is safe to auto-deploy unlike the worker above. Exit
  # code is 1 on any unhealthy check (see health_check.py's own docstring);
  # Render's own cron-job failure notification is what actually pages
  # someone — wire that up in the dashboard (Settings -> Notifications) once
  # this is deployed, since a green "job ran" in Render's UI without that
  # doesn't alert anyone on its own.
  - type: cron
    name: line-buddy-odds-worker-health-check
    runtime: python
    rootDir: python-odds-service
    buildCommand: pip install -r requirements.txt
    schedule: "*/15 * * * *"
    startCommand: python src/health_check.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      # Transaction-mode pooler (port 6543), not session-mode (5432) like
      # the worker — see config.py's DB_POOLER_MODE docstring. Session
      # mode's connection cap kept refusing this cron's own brand-new
      # connection even after trimming every other consumer's pool size
      # (2026-08-26); transaction mode multiplexes over far fewer physical
      # backends and doesn't hold one dedicated to this short-lived process.
      - key: DB_POOLER_MODE
        value: transaction
