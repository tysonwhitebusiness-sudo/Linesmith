# Task 3.11 — CI, scoped by standing decision Q20.
#
# NO DATABASE CREDENTIALS. That is the point, not a limitation to work around:
# a CI run holding production write credentials is a new attack surface, not a
# safety net, and most of this project's Python tests write and delete real
# rows. So CI runs only what is genuinely hermetic, and the split is explicit
# below rather than implied by whatever happened to pass.
#
# HOW THE NINE WERE CHOSEN, including the one that got it wrong. Greping for
# httpx/get_pool misclassified several, so each candidate was run with
# DATABASE_URL unset and kept if it passed. That check was NOT SUFFICIENT:
# test_game_context_roster passed it and then failed in CI, because it reads
# real Postgres snapshots and only degrades to warnings locally. Its own
# docstring says so in the first paragraph — "against the REAL,
# already-populated Postgres snapshots" and "Not a permanent CI-style suite" —
# which is a reminder that reading the file beats inferring from behaviour.
#
# Anything needing a database, the network, ~25-50 minutes, or a package that
# exists only on the scraper laptop stays local, and is listed in the last step
# so the boundary is visible beside the tests that do run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # The build imports modules that read these at module scope. They are
          # never connected to during a build, and are deliberately not real —
          # if a build step ever genuinely needs a live database, that is a bug
          # in the build, not a reason to add a secret here.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-odds-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # One step per test, not a loop. A loop puts the failure inside a log
      # that needs authentication to read; a named step surfaces WHICH test
      # failed through the public API and in the run summary. That mattered
      # immediately — the first version was a loop, it went red, and the only
      # thing observable from outside was "Hermetic tests failed".
      #
      # NOT pytest: these are standalone scripts, not pytest modules, so
      # `python -m pytest` collects almost nothing and would report a green
      # run having tested nothing.
      - name: test_entity_resolution
        run: python -u src/test_entity_resolution.py
      - name: test_leakage_guard
        run: python -u src/test_leakage_guard.py
      - name: test_mlb_prop_grading
        run: python -u src/test_mlb_prop_grading.py
      - name: test_mlb_source_flip
        run: python -u src/test_mlb_source_flip.py
      - name: test_odds_lines_cycle_book_lines
        run: python -u src/test_odds_lines_cycle_book_lines.py
      - name: test_price_staleness
        run: python -u src/test_price_staleness.py
      - name: test_providers
        run: python -u src/test_providers.py
      - name: test_under_side_probability
        run: python -u src/test_under_side_probability.py
      - name: test_walkforward
        run: python -u src/test_walkforward.py
      # Added in Phase 5. One step per test, same as above, so a failure names
      # itself in the Actions UI rather than collapsing into "Hermetic tests
      # failed" — logs are private on this repo, job and step names are not.
      - name: test_activation_guardrails
        run: python -u src/test_activation_guardrails.py
      - name: test_canonical_bookmaker
        run: python -u src/test_canonical_bookmaker.py
      - name: test_modal_point
        run: python -u src/test_modal_point.py
      - name: test_consensus_and_matching
        run: python -u src/test_consensus_and_matching.py
      - name: test_propline_alt_lines
        run: python -u src/test_propline_alt_lines.py
      - name: test_model_hygiene
        run: python -u src/test_model_hygiene.py
      - name: test_market_gate
        run: python -u src/test_market_gate.py
      - name: test_both_sides
        run: python -u src/test_both_sides.py
      - name: test_platt_calibration
        run: python -u src/test_platt_calibration.py
      - name: Not run here, and why
        run: |
          echo "Deliberately excluded from CI (Q20 — no database credentials in Actions):"
          echo "  needs a live database:  test_game_context_roster, test_calibration, test_elo_and_pitcher_game_score,"
          echo "                          test_game_pick_lock, test_game_sim_cache,"
          echo "                          test_odds_lines_cycle, test_staking, test_write_prop_odds,"
          echo "                          test_mlb_bradley_terry"
          echo "  25-50 min + live data:  test_mlb_mlp, test_mlb_tree_models, test_mlb_stacking,"
          echo "                          test_model_benchmark"
          echo "  scraper laptop only:    test_harvester_scrape (imports oddsharvester)"
          echo "These run locally. See docs/CURRENT.md."
