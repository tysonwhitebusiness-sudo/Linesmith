name: OddsHarvester scrape (manual diagnostic only)

# NO LONGER THE PRODUCTION SCRAPE PATH — see scripts/harvester-laptop/ for
# that. Real run evidence (2026-08-25, workflow 89041102402): OddsPortal
# returns a hard HTTP 429 (zero bytes, Varnish/nginx edge) to GitHub
# Actions' shared runner IPs — not a code/config problem on our side, a
# genuine IP-level rate limit. GitHub's IP ranges are heavily shared across
# every public repo's CI traffic, so this isn't something fixable here; the
# actual scrape now runs on a dedicated always-on machine with a normal
# residential IP instead (OddsPortal's own docs describe residential IPs as
# getting normal, un-blocked treatment).
#
# Kept as `workflow_dispatch`-only (no schedule) for exactly one purpose:
# re-checking whether GitHub's IPs are still blocked, without needing the
# laptop, if this is ever worth re-testing. Never runs on its own.

on:
  workflow_dispatch:
    inputs:
      sports:
        description: 'Space-separated sport keys to scrape (default: all configured)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-odds-service dependencies
        run: pip install -r python-odds-service/requirements.txt

      - name: Install oddsharvester package
        run: pip install ./oddsharvester

      - name: Install Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Run scrape
        working-directory: python-odds-service
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/harvester_scrape.py ${{ github.event.inputs.sports }}

      # Two real runs both failed identically (odds-format dropdown
      # timeout, page height 0, 0 event rows) even after fixing the
      # Chromium CI-flags gap — that fix made no observable difference, so
      # guessing a third blind patch isn't warranted. This captures what
      # OddsPortal actually serves to this runner's IP (status/headers/
      # screenshot/HTML) instead — only runs when the scrape step above
      # failed, and never blocks a successful run.
      - name: Diagnose failure (screenshot + HTML + response status)
        if: failure()
        working-directory: python-odds-service
        env:
          HARVESTER_DIAGNOSE_OUT: ${{ github.workspace }}/diagnose-out
        run: python src/harvester_diagnose.py

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harvester-diagnose
          path: diagnose-out/
          retention-days: 7
