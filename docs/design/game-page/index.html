<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game page · mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* app/globals.css :root, verbatim */
  --paper:oklch(94.5% .003 260);--card:oklch(98.5% .002 260);--sunk:oklch(96.5% .002 260);--line:oklch(89% .004 260);--soft:oklch(92.5% .003 260);--hair:oklch(95% .003 260);
  --ink:oklch(18% .005 260);--ink2:oklch(34% .005 260);--ink3:oklch(47% .005 260);--faint:oklch(72% .004 260);--masters:oklch(20% .006 260);
  --fb:'Roboto Condensed',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fd:'Barlow Condensed','Roboto Condensed',ui-sans-serif,system-ui,sans-serif;
  --good:#00d26a;--bad:#ff4d4f;--warn:#ffb020;--good-ink:#00873f;--bad-ink:#c4161c;--warn-ink:#9a6200;--good-on:#04311a;--bad-on:#3d0405;
  --char:#1d1f23;--char3:#34373d;--char-rule:#6e727a;--r:12px;--rc:8px;
  --shadow:0 1px 2px rgba(15,18,24,.05),0 2px 8px -4px rgba(15,18,24,.08);
  --away:#444;--home:#888;
}
*{box-sizing:border-box}
body{margin:0;background:#d9dce1;color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
/* TYPE SYSTEM 1: headlines, card and section titles, player and team names in the display face */
.sech h2,.ch h3,.tn2 .nm,.bigsc,.plate .big,.plate .down,.dia .inn,.pc .who,.perf .who{font-family:var(--fd)}
.tn,.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ---------- mockup chrome (not the design) ---------- */
.mk{position:relative;z-index:50;background:#111316;color:#e9ebee;font:13px/1.4 ui-sans-serif,system-ui,sans-serif}
.mk .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 16px}
.mk b.t{font-size:14px;margin-right:6px}
.mk .grp{display:flex;gap:2px;background:#24272c;border-radius:8px;padding:2px}
.mk .grp button{border:0;background:none;color:#c9cdd3;padding:6px 10px;border-radius:6px;cursor:pointer}
.mk .grp button.on{background:#fff;color:#111;font-weight:600}
.mk .src{padding:0 16px 8px;color:#aeb3ba;font-size:12px}
.mk .src b{color:#fff;font-weight:600}
.mknote{max-width:1280px;margin:12px auto 0;padding:0 16px}
.mknote div{border:1px dashed #9aa0a8;background:#fffbea;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#3a3d42}
.mknote div+div{margin-top:6px}

/* ---------- the page frame ---------- */
.stage{padding:14px 0 80px}
.frame{container:page/inline-size;background:var(--paper);margin:0 auto;max-width:1280px;min-height:100vh}
.frame.phone{max-width:390px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #16181b,0 20px 60px rgba(0,0,0,.35)}
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in oklch,var(--paper) 95%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px}
.topbar .brand{display:flex;align-items:center;gap:6px;min-width:0}
.topbar .brand img{height:18px;width:auto}
.topbar .brand b{font-size:14px;font-weight:600;letter-spacing:-.025em}
.topbar .sp{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:500;color:var(--ink2)}
.topbar .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;margin:0 auto;font-size:13px;font-weight:500;color:var(--ink2)}
.topbar .rt{display:flex;align-items:center;gap:12px}
.topbar .clk{font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.topbar .slip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--masters);color:#fff;font-size:13px;font-weight:600}
.topbar .slip span{border-radius:2px;background:rgba(255,255,255,.2);padding:0 4px;font-variant-numeric:tabular-nums}
.topbar .sin{font-size:13px;font-weight:600;color:var(--ink2);padding:0 4px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:color-mix(in oklch,var(--ink) 2%,transparent);padding:6px 12px}
.strip .all{flex:none;display:grid;place-items:center;height:41px;padding:0 10px;border-radius:8px;background:var(--card);font-size:11px;font-weight:600}
.strip .gm{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:41px;padding:4px 6px;min-width:96px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:11px}
.strip .gm.on{box-shadow:inset 0 0 0 2px var(--ink)}
.strip .gm .m{display:flex;align-items:center;gap:4px;font-weight:600}
.strip .gm .m img{width:14px;height:14px;object-fit:contain}
.strip .gm .m i{font-style:normal;font-weight:400;color:var(--ink3)}
.strip .gm .s{color:var(--ink3)}.strip .gm .s.live{color:var(--good-ink);font-weight:600}
.strip .gm.ph{min-width:96px;opacity:.55}
@container page (max-width:639px){.topbar .brand b,.topbar .clk,.topbar .sin{display:none}.topbar{gap:8px;padding:0 8px}}
.main{--g:24px;padding:12px 24px 40px}
@container page (max-width:767px){.main{--g:12px;padding:12px 12px 30px}}

/* ---------- HERO ---------- */
.hero{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--soft)}
.band{position:relative;min-height:188px;color:#fff;isolation:isolate}
.band .half{position:absolute;inset:0;z-index:-1}
.band .half.a{background:linear-gradient(115deg,var(--a0) 0%,var(--a1) 60%,var(--a2) 100%);clip-path:polygon(0 0,53.5% 0,46.5% 100%,0 100%)}
.band .half.h{background:linear-gradient(245deg,var(--h0) 0%,var(--h1) 60%,var(--h2) 100%);clip-path:polygon(53.5% 0,100% 0,100% 100%,46.5% 100%)}
.band .seam{position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom right,transparent calc(50% - 1.5px),rgba(255,255,255,.55) 50%,transparent calc(50% + 1.5px));clip-path:polygon(46% 0,54% 0,54% 100%,46% 100%);opacity:.0}
.band .seamline{position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:3px;background:rgba(255,255,255,.28);transform:skewX(-2.1deg) translateX(-50%)}
.band .wm{position:absolute;z-index:-1;top:50%;width:250px;height:250px;object-fit:contain;opacity:.14;transform:translateY(-50%);filter:saturate(0) brightness(3)}
.band .wm.a{left:-40px}.band .wm.h{right:-40px}
.bandrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding:22px 26px}
.team{display:flex;align-items:center;gap:14px;min-width:0}
.team.h{flex-direction:row-reverse;text-align:right}
.crest{flex:none;width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.crest img{width:52px;height:52px;object-fit:contain}
.crest.flag img{width:74px;height:74px;border-radius:50%;object-fit:cover}
.tn2{min-width:0;flex:1}
.tn2 .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tn2 .meta{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;display:flex;gap:6px;align-items:center}
.team.h .tn2 .meta{justify-content:flex-end}
.tn2 .scorers{margin-top:6px;font-size:12px;color:rgba(255,255,255,.8);line-height:1.35}
.poss{display:inline-block;width:18px;height:11px;border-radius:50%;background:#8b4a1c;border:1.5px solid #fff;position:relative;vertical-align:middle}
.poss:after{content:'';position:absolute;left:4px;right:4px;top:4px;height:1px;background:#fff}
.bigsc{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.bigsc.dim{opacity:.55}
.plate{min-width:260px;max-width:340px;background:rgba(8,10,13,.62);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;text-align:center;backdrop-filter:blur(6px)}
.plate .st{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.15)}
.plate .st.live{background:#fff;border-color:#fff;color:var(--ink)}
.plate .st.live i{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 1.8s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.25}}
.plate .big{font-size:32px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.plate .mid{font-size:13px;color:rgba(255,255,255,.8)}
.plate .down{font-size:22px;font-weight:600;margin-top:4px}
.plate .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.plate .chip{font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.15);white-space:nowrap}
.plate .chip.hot{background:#fff;border-color:#fff;color:var(--ink)}
.dia{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.dia .inn{font-size:32px;font-weight:700;line-height:1}
.dia .inn small{display:block;font-family:var(--fb);font-size:11px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.cnt{display:grid;grid-template-columns:auto auto;gap:3px 7px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-align:left}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75)}
.dots i.on{background:#fff;border-color:#fff}
.setgrid{border-collapse:collapse;margin:6px auto 0;font-variant-numeric:tabular-nums}
.setgrid td{padding:3px 8px;font-family:var(--fd);font-size:22px;font-weight:600;text-align:center;opacity:.65}
.setgrid td.w{opacity:1}
.setgrid td.nm{font-family:var(--fb);font-size:12px;text-align:left;opacity:.95;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setgrid sup{font-size:10px}

.hbody{padding:0}
.hrow{padding:14px 22px;border-top:1px solid var(--soft)}
.hrow:first-child{border-top:0}
.olab{font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
/* the matchup / probables / decisions row */
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:16px;align-items:center}
.duel .vs{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.pc{display:flex;align-items:center;gap:12px;min-width:0}
.pc.r{flex-direction:row-reverse;text-align:right}
.hs{flex:none;border-radius:50%;background:var(--sunk);object-fit:cover;border:2px solid var(--tc,var(--soft))}
.hs.l{width:64px;height:64px}.hs.m{width:44px;height:44px}.hs.s{width:28px;height:28px;border-width:1.5px}
.pc .role{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.pc .who{font-size:17px;font-weight:600;line-height:1.3}
.pc .who .hand{font-family:var(--fb);font-size:11px;font-weight:600;color:var(--ink2);margin-left:6px;border:1px solid var(--soft);background:var(--sunk);border-radius:999px;padding:1px 7px;vertical-align:2px}
.pc .ln{font-size:13px;color:var(--ink2);margin-top:2px}
.tlogo{width:14px;height:14px;object-fit:contain;margin-right:4px;flex:none}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:5px;vertical-align:1px;flex:none}
.abz{display:flex;gap:12px;align-items:center;border-left:1px solid var(--soft);padding-left:16px}
.abz .txt{font-size:12px;color:var(--ink2);max-width:170px}
.abz .txt b{display:block;color:var(--ink);font-size:13px}
.deck{font-size:12px;color:var(--ink3);margin-top:8px}
.deck b{color:var(--ink2)}
.mixbars{display:flex;gap:3px;margin-top:6px}
.mixbars span{height:6px;border-radius:3px}
.mixkey{font-size:11px;color:var(--ink3);margin-top:3px}
.perfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.perf{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 10px;border-left:3px solid var(--tc)}
.perf .who{font-weight:600;font-size:16px;line-height:1.2}
.perf .ln{font-size:12px;color:var(--ink2)}
.dec{display:inline-grid;place-items:center;min-width:22px;height:22px;font-size:12px;font-weight:700;border-radius:6px;padding:0 4px;margin-right:6px;background:var(--sunk);color:var(--ink2);vertical-align:middle}
.dec.W{background:var(--good);color:var(--good-on)}.dec.L{background:var(--bad);color:#fff}
/* field strip */
.fstrip{position:relative}
.fstrip svg{display:block;width:100%;height:auto}
.lastplay{font-size:13px;color:var(--ink2);margin-top:8px}
.lastplay b{color:var(--ink)}
/* line score */
.ls{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ls th{height:28px;font-size:12px;font-weight:600;color:var(--ink3);padding:0 6px;text-align:center;background:var(--sunk);border-bottom:1px solid var(--line)}
.ls td{height:28px;padding:0 6px;text-align:center;font-size:12px;font-weight:500;color:var(--ink2);border-bottom:1px solid var(--soft)}
.ls tr:last-child td{border-bottom:0}
.ls td.t{font-weight:600;color:var(--ink)}
.ls th.t{color:var(--ink)}
.ls td.tm{text-align:left;padding-left:8px;font-weight:500;color:var(--ink);white-space:nowrap}
.ls td.tm .tlogo{vertical-align:-3px;margin-right:6px}
.ls .cur{background:var(--sunk)}
.ls th.cur{background:var(--sunk);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.ls .gap{border-left:1px solid var(--soft)}
.scroll{overflow-x:auto}
/* wp / lines */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.two>div{min-width:0}
.tug{display:flex;height:28px;border-radius:8px;overflow:hidden;font-size:13px;font-weight:700;color:#fff}
.tug span{display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:0}
.tug span:last-child{justify-content:flex-end}
.tugsub{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:5px}
.lines{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.lines th{height:28px;font-size:12px;color:var(--ink3);font-weight:600;text-align:right;padding:0 6px;background:var(--sunk);border-bottom:1px solid var(--line)}
.lines th:first-child,.lines td:first-child{text-align:left}
.lines td{height:36px;padding:0 6px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
.lines td.now{font-weight:700}
.lines td .mv{font-size:12px;color:var(--ink3);margin-left:4px}
.lines tr:last-child td{border-bottom:0}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.res span{font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.04em;color:var(--ink2);border-radius:999px;padding:3px 8px;background:var(--sunk);border:1px solid var(--soft)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 24px;border-top:1px solid var(--soft);font-size:13px;color:var(--ink2)}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts svg{width:16px;height:16px;flex:none}
.facts b{color:var(--ink);font-weight:600}
.miss{font-size:12px;color:var(--warn-ink);margin-top:6px}
@container page (max-width:640px){
  .band{min-height:0}
  .bandrow{grid-template-columns:1fr;gap:10px;padding:14px}
  .team,.team.h{flex-direction:row;text-align:left}
  .team.h .tn2 .meta{justify-content:flex-start}
  .crest{width:46px;height:46px}.crest img{width:32px;height:32px}.crest.flag img{width:46px;height:46px}
  .tn2 .nm{font-size:19px}
  .bigsc{font-size:40px}
  .plate{order:3;min-width:0;max-width:none;width:100%}
  .band .half.a{clip-path:polygon(0 0,100% 0,100% 34%,0 52%)}
  .band .half.h{clip-path:polygon(0 52%,100% 34%,100% 100%,0 100%)}
  .band .seamline{display:none}
  .band .wm{width:140px;height:140px}
  .band .wm.a{top:22%;left:auto;right:-20px}.band .wm.h{top:66%}
  .hrow{padding:12px 14px}
  .duel{grid-template-columns:1fr;gap:10px}
  .duel .vs{display:none}
  .pc.r{flex-direction:row;text-align:left}
  .abz{border-left:0;padding-left:0;border-top:1px solid var(--soft);padding-top:10px}
  .two{grid-template-columns:1fr;gap:14px}
  .facts{padding:10px 14px}
  .dia{gap:12px}
}

/* ---------- sections ---------- */
.snav{position:sticky;top:var(--hdr,103px);z-index:25;display:flex;gap:16px;overflow-x:auto;background:color-mix(in oklch,var(--paper) 90%,transparent);backdrop-filter:blur(8px);margin:16px 0 0;border-bottom:1px solid var(--char3);scrollbar-width:none}
.snav a{flex:none;margin-bottom:-1px;border-bottom:2px solid transparent;padding:12px 0 11px;font-size:14px;line-height:1.5;font-weight:600;color:var(--ink3);white-space:nowrap}
.snav a:hover{color:var(--ink)}
.snav a.on{border-bottom-color:var(--ink);color:var(--ink)}

.sec{margin-top:32px;scroll-margin-top:110px}
.sech{position:relative;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 12px;border-bottom:1px solid var(--soft);padding:8px 0 8px 20px;margin:0 calc(var(--g) * -1) 14px}
.sech:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:999px;background:var(--char)}
.sech h2{margin:0;font-size:22px;font-weight:600;line-height:1.2;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.sech .sub{font-size:13px;line-height:1.45;color:var(--ink3)}
.sech .hide{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.sech .hide:hover{background:var(--sunk);color:var(--ink)}
@container page (max-width:639px){.sech{flex-wrap:wrap;padding-left:16px}.sech h2{font-size:17px;line-height:1.3}.sech .hide{margin-left:0}}
.secnote{font-size:13px;color:var(--ink2);margin:-4px 0 10px 2px}
.crow{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:14px;margin-bottom:14px}
@container page (max-width:900px){.crow{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--soft);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card.acc{border-top:3px solid var(--tc)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:44px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--soft)}
.ch h3{margin:0;font-size:16px;line-height:1.3;font-weight:600;letter-spacing:.03em;text-transform:uppercase;flex:1;display:flex;align-items:center;gap:6px;min-width:9em}
.ch h3 img{width:20px;height:20px;object-fit:contain}
.ch .badge{font-family:var(--fb);font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.04em;color:var(--ink2);border-radius:6px;padding:1px 6px;box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.ch .scope{font-size:12px;line-height:1.35;font-weight:500;color:var(--ink3);text-align:right;padding-right:8px}
.cap{font-size:12px;line-height:1.35;font-weight:500;color:var(--ink3);padding:8px 16px 12px}
.empty{padding:24px 16px;text-align:center;color:var(--ink3);font-size:13px}
.empty b{display:block;color:var(--ink2);margin-bottom:4px}

.who2{display:flex;align-items:center;gap:9px;min-width:150px}

/* StatusMark (components/ui/Pieces.tsx) */
.smk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:700}

.pct{display:flex;align-items:center;gap:7px;justify-content:flex-end}

/* mirrored comparison (team stats) */

/* props tracker */

/* form */
.form{display:flex;align-items:flex-end;gap:5px;padding:12px 16px 4px;height:170px}
.form .g{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:18px;height:100%}

/* drilldown */

@container page (max-width:639px){.ch .scope{text-align:left}}

.tip div:first-child{font-size:14px;font-weight:700}
.tip div+div{color:rgba(255,255,255,.7);margin-top:2px}
</style>
