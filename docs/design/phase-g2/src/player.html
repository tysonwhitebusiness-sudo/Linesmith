<meta charset="utf-8">
<title>Player Page — Sport Switcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--SYSTEM-->
<!--DATA:ALL-->
<!--DATA:PREFIX:matchup-->
<style>
  .switch-bar { background: var(--card); border-bottom: 1px solid var(--line); }
  .switch-bar .inner { max-width: 1280px; margin: 0 auto; padding: 10px var(--s5); display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
  .switch-bar .sport-tabs button { border-color: var(--line); color: var(--ink-2); }
  .switch-bar .sport-tabs button:hover { background: var(--card-sunk); }
  .switch-bar .sport-tabs button[aria-pressed="true"] { background: var(--masters); color: #fff; border-color: var(--masters); }
  .switch-bar .sport-tabs { max-width: 100%; }
  .why { font-size: 12px; color: var(--ink-muted); max-width: 1280px; margin: 0 auto; padding: 0 var(--s5) 10px; }
  .secnav .tabs { overflow-x: auto; scrollbar-width: none; }
  @media (max-width: 720px) { .switch-bar .inner, .why { padding-left: var(--s4); padding-right: var(--s4); } }
</style>
<body>
<div id="bar"></div>
<div id="switch"></div>
<main class="page" id="app"></main>
<script>
const params = new URLSearchParams(location.search);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } return null; };
let sport = params.get('sport') || store('g2-player-sport') || 'mlb';
if (!SPORTS[sport]) sport = 'mlb';
let subject = params.get('subject') || store(`g2-player-subject-${sport}`) || SPORTS[sport].subjects[0].slug;
let observer = null;
const cmpState = { vs: params.get('vs') ?? undefined, peer: params.get('peer') || '' };

document.getElementById('bar').append(boardBar('Phase G2 · Player page', 'Real data · switch sport and player below'));

function renderSwitch() {
  const subjects = SPORTS[sport].subjects;
  if (!subjects.some((x) => x.slug === subject)) subject = subjects[0].slug;
  const sportBtns = h('div', { class: 'sport-tabs', role: 'group', 'aria-label': 'Sport' }, ...Object.entries(SPORTS).map(([key, def]) => h('button', { type: 'button', 'aria-pressed': String(key === sport), onclick: () => { sport = key; cmpState.vs = undefined; cmpState.peer = ''; store('g2-player-sport', key); subject = store(`g2-player-subject-${key}`) || SPORTS[key].subjects[0].slug; renderAll(); } }, def.label)));
  const subjSeg = subjects.length > 1 ? segmented(subjects.map((x) => ({ value: x.slug, label: x.label })), subject, (v) => { cmpState.vs = undefined; cmpState.peer = ''; subject = v; store(`g2-player-subject-${sport}`, v); renderAll(); }) : h('span', { class: 'chip' }, subjects[0].label);
  document.getElementById('switch').replaceChildren(h('div', { class: 'switch-bar' }, h('div', { class: 'inner' }, h('span', { class: 't-over' }, 'Sport'), sportBtns, h('span', { style: { flex: 1 } }), h('span', { class: 't-over' }, 'Player'), subjSeg)));
}

function renderPage() {
  const def = SPORTS[sport].subjects.find((x) => x.slug === subject);
  const raw = loadData(`player-${subject}`);
  const app = document.getElementById('app');
  if (!raw) { app.replaceChildren(h('div', { class: 'state' }, `No dataset for ${subject}`)); return; }
  const doc = def.spec.transform ? def.spec.transform(raw) : raw;
  const spec = { ...def.spec, transform: null };
  const cmp = CMP.playerCompare(doc, spec, subject, cmpState, () => renderAll(false));
  const base = buildPlayerPage(doc, spec, { sport, subject });
  const sections = [base[0], ...cmp.sections, ...base.slice(1)];
  let active = sections[0].id;
  const navTabs = tabs(sections.map((x) => ({ value: x.id, label: x.label })), active, (v) => { document.getElementById(`sec-${v}`)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); });
  const nav = h('div', { class: 'secnav sticky', style: { marginTop: 'var(--s4)' } }, navTabs);
  put(app, playerHero(doc, spec), cmp.bar, nav, ...sections.map((x) => x.node));
  const barH = document.getElementById('bar').offsetHeight;
  nav.style.top = `${barH}px`;
  document.querySelectorAll('.psec').forEach((el) => { el.style.scrollMarginTop = `${barH + nav.offsetHeight + 12}px`; });
  // Keep the nav in step with scrolling.
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    const vis = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis) return;
    const id = vis.target.dataset.sec;
    navTabs.querySelectorAll('[role="tab"]').forEach((b, i) => { const on = sections[i].id === id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on && navTabs.scrollWidth > navTabs.clientWidth) navTabs.scrollLeft = b.offsetLeft - 24; });
  }, { rootMargin: `-${barH + 60}px 0px -60% 0px` });
  document.querySelectorAll('.psec').forEach((el) => observer.observe(el));
  document.title = `Player Page — ${doc.bio?.name || subject} (${SPORTS[sport].label})`;
}

function renderAll(top = true) {
  const u = new URL(location.href); u.searchParams.set('sport', sport); u.searchParams.set('subject', subject);
  if (cmpState.vs !== undefined) u.searchParams.set('vs', cmpState.vs); else u.searchParams.delete('vs');
  if (cmpState.peer) u.searchParams.set('peer', cmpState.peer); else u.searchParams.delete('peer');
  try { history.replaceState(null, '', u); } catch {}
  const y = window.scrollY; renderSwitch(); renderPage(); window.scrollTo({ top: top ? 0 : y });
}
renderAll();
</script>
</body>
