  --bad: #c23b2c;
  --warn: #b7791f;

  --cmp-b: #c56a1c;                        /* compare slot 2 (validated) */
  --live: #0f7a4f;
  --focus: oklch(18% 0.005 260);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

}

body.font-inter { --font: "Inter", ui-sans-serif, system-ui, sans-serif; }

.icon-btn:hover { background: var(--card-sunk); color: var(--ink); }

<div id="app"></div>
<script>

function marginChart(games) {

  const draw = (Wd) => {

    const max = Math.max(14, ...games.map((g) => Math.abs(g.pf - g.pa)));

}

function resultsCard() {

}

function statsCard() {
  const groups = [...new Set(T.teamStats.map((x) => x.group))];
  return card({ title: 'Team stats', scope: '2025 season · rank of 32', info: 'Bars show league percentile from the rank, already direction-aware (fewer sacks taken ranks higher). Hover for value and rank.',
    body: h('div', { class: 'stack' }, ...groups.map((grp) => h('div', null, h('div', { class: 't-over', style: { margin: '4px 0' } }, grp), ...T.teamStats.filter((x) => x.group === grp).map((x) => pbar(x.label, x.decimals ? Number(x.value).toFixed(x.decimals) : fmt.n(x.value, 1), Math.round(((32 - x.rank) / 31) * 100), { info: `${fmt.ord(x.rank)} of 32` }))))),
    foot: '2026 has one game so far; the season toggle above the section would switch this to 2026 once the sample is meaningful' });
}

function gradesCard() {
  const names = { offense: 'Offense', defense: 'Defense', specialTeams: 'Special teams', passingOffense: 'Passing offense', rushingOffense: 'Rushing offense', receivingOffense: 'Receiving', dLine: 'D-line', linebackers: 'Linebackers', secondary: 'Secondary' };
  const tone = (c) => (c >= 60 ? 'var(--good)' : c >= 35 ? 'oklch(45% 0.005 260)' : 'var(--bad)');
  return card({ title: 'Unit grades', scope: '2025 · vs league', info: 'Letter from a composite of each unit\'s ranked stats. Hover for rank.',

}

function rosterCard() {
  const order = GROUPS[unit];
  const people = T.roster.filter((p) => order.includes(p.pos)).sort((a, b) => order.indexOf(a.pos) - order.indexOf(b.pos) || a.name.localeCompare(b.name));
